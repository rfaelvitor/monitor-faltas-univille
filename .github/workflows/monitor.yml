name: Monitor de faltas

on:
  schedule:
    # 23:47 UTC = 20:47 em Brasília, todo dia (minuto quebrado pra fugir da fila das horas cheias)
    - cron: "47 23 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: monitor-faltas
  cancel-in-progress: false

jobs:
  verificar:
    # padrão: servidor do GitHub. Se o login esbarrar no reCAPTCHA, crie a variável
    # RUNNER=self-hosted e rode num computador seu (veja o README)
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # uv baixa um Python portátil, sem instalador (o setup-python falha em runner Windows rodando como serviço)
      # no Windows o Node às vezes quebra no fim da ação mesmo com o uv já instalado
      - uses: astral-sh/setup-uv@v6
        continue-on-error: true
        with:
          version: "0.13.1"

      - name: Conferir uv
        run: uv --version

      - name: Instalar dependências
        run: uv run --python 3.12 --with-requirements requirements.txt python -m playwright install chromium

      - name: Dependências do sistema (Linux)
        if: runner.os == 'Linux'
        run: uv run --python 3.12 --with-requirements requirements.txt python -m playwright install-deps chromium

      - name: Verificar faltas
        env:
          UNIVILLE_USUARIO: ${{ secrets.UNIVILLE_USUARIO }}
          UNIVILLE_SENHA: ${{ secrets.UNIVILLE_SENHA }}
          SENHA_PAINEL: ${{ secrets.SENHA_PAINEL }}
          GMAIL_USUARIO: ${{ secrets.GMAIL_USUARIO }}
          GMAIL_SENHA_APP: ${{ secrets.GMAIL_SENHA_APP }}
          EMAIL_DESTINO: ${{ secrets.EMAIL_DESTINO }}
          URL_PAINEL: ${{ vars.URL_PAINEL || format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}
          LIMITE_FALTAS: ${{ vars.LIMITE_FALTAS }}
          NIVEIS_ALERTA: ${{ vars.NIVEIS_ALERTA }}
          LIMITES_ESPECIFICOS: ${{ vars.LIMITES_ESPECIFICOS }}
          SEMESTRE: ${{ vars.SEMESTRE }}
          HEADLESS: ${{ vars.HEADLESS }}
          LOG_DETALHADO: ${{ vars.LOG_DETALHADO }}
          PYTHONUTF8: "1"
        run: uv run --python 3.12 --with-requirements requirements.txt python -m faltas

      - uses: actions/upload-artifact@v4
        with:
          name: painel
          path: site/
          retention-days: 1

  publicar:
    needs: verificar
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: painel
          path: site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
